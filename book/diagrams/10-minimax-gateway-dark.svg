<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="h" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#9da7b3"/></marker></defs>
<rect width="1000" height="480" fill="#0d1117"/>
<text x="130" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#9da7b3">AGENT SIDE</text>
<text x="500" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#9da7b3">MIDDLEWARE</text>
<text x="870" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#9da7b3">TRAINING SIDE</text>
<rect x="20" y="50" width="220" height="120" rx="10" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="130.0" y="85.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">White-box agent</text><text x="130.0" y="105.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">context rules registered</text><text x="130.0" y="125.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">(truncate, summarize, ...),</text><text x="130.0" y="145.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">so states can be rebuilt</text><rect x="20" y="200" width="220" height="120" rx="10" fill="#422006" stroke="#fbbf24" stroke-width="2"/><text x="130.0" y="235.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Black-box agent</text><text x="130.0" y="255.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">any scaffold; internals</text><text x="130.0" y="275.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">hidden, e.g. its own</text><text x="130.0" y="295.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">memory or sub-agents</text><rect x="20" y="380" width="220" height="80" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="2"/><text x="130.0" y="415.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Environment</text><text x="130.0" y="435.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">tools, sandbox, tests</text><rect x="400" y="50" width="200" height="270" rx="10" fill="#052e16" stroke="#4ade80" stroke-width="2"/><text x="500.0" y="130.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Gateway</text><text x="500.0" y="150.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3"></text><text x="500.0" y="170.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">looks like an ordinary</text><text x="500.0" y="190.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">model API to the agent;</text><text x="500.0" y="210.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">forwards each call and</text><text x="500.0" y="230.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">logs the exact context</text><text x="500.0" y="250.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">and completion</text><rect x="400" y="380" width="200" height="80" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="2"/><text x="500.0" y="415.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Data pool</text><text x="500.0" y="435.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">logged calls + reward</text><rect x="760" y="50" width="220" height="120" rx="10" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/><text x="870.0" y="95.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Rollout engine</text><text x="870.0" y="115.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">current policy</text><text x="870.0" y="135.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">generates completions</text><rect x="760" y="340" width="220" height="120" rx="10" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/><text x="870.0" y="385.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Train engine</text><text x="870.0" y="405.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">policy-gradient update</text><text x="870.0" y="425.0" text-anchor="middle" font-size="13" font-weight="400" fill="#e6edf3">on logged calls</text><line x1="242" y1="95" x2="398" y2="95" stroke="#9da7b3" stroke-width="2" marker-end="url(#h)"/><text x="320" y="87" text-anchor="middle" font-size="12.5" fill="#9da7b3">context sₜ</text><line x1="398" y1="130" x2="242" y2="130" stroke="#9da7b3" stroke-width="2" marker-end="url(#h)"/><text x="320" y="122" text-anchor="middle" font-size="12.5" fill="#9da7b3">action aₜ</text><line x1="242" y1="245" x2="398" y2="245" stroke="#9da7b3" stroke-width="2" marker-end="url(#h)"/><text x="320" y="237" text-anchor="middle" font-size="12.5" fill="#9da7b3">context sₜ</text><line x1="398" y1="280" x2="242" y2="280" stroke="#9da7b3" stroke-width="2" marker-end="url(#h)"/><text x="320" y="272" text-anchor="middle" font-size="12.5" fill="#9da7b3">action aₜ</text><line x1="110" y1="322" x2="110" y2="378" stroke="#9da7b3" stroke-width="2" marker-end="url(#h)"/><line x1="150" y1="378" x2="150" y2="322" stroke="#9da7b3" stroke-width="2" marker-end="url(#h)"/><text x="162" y="355" font-size="12.5" fill="#9da7b3">observation oₜ</text><line x1="602" y1="95" x2="758" y2="95" stroke="#9da7b3" stroke-width="2" marker-end="url(#h)"/><text x="680" y="87" text-anchor="middle" font-size="12.5" fill="#9da7b3">request</text><line x1="758" y1="130" x2="602" y2="130" stroke="#9da7b3" stroke-width="2" marker-end="url(#h)"/><text x="680" y="122" text-anchor="middle" font-size="12.5" fill="#9da7b3">completion</text><line x1="500" y1="322" x2="500" y2="378" stroke="#9da7b3" stroke-width="2" marker-end="url(#h)"/><text x="512" y="355" text-anchor="start" font-size="12.5" fill="#9da7b3">log</text><line x1="602" y1="420" x2="758" y2="420" stroke="#9da7b3" stroke-width="2" marker-end="url(#h)"/><text x="680" y="412" text-anchor="middle" font-size="12.5" fill="#9da7b3">batches</text><line x1="870" y1="338" x2="870" y2="172" stroke="#9da7b3" stroke-width="2" marker-end="url(#h)"/><text x="882" y="258" text-anchor="start" font-size="12.5" fill="#9da7b3">new weights</text></svg>
