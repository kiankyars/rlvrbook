<script>
// The color scheme toggle is a link to the current page; drop the href so
// clicking it never navigates or scrolls, and keep it keyboard-accessible.
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".quarto-color-scheme-toggle").forEach(function (el) {
    el.removeAttribute("href");
    el.setAttribute("role", "button");
    el.setAttribute("tabindex", "0");
    el.style.cursor = "pointer";
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); }
    });
  });
});

// Quarto's toggle has a Safari-only scrollbar workaround that calls
// scrollTo(0, 1) and then scrollTo(0, 0), which jumps the reader to the top
// of the page. Keep the nudge but apply it at the current scroll position.
(function () {
  var toggle = window.quartoToggleColorScheme;
  if (typeof toggle !== "function") return;
  window.quartoToggleColorScheme = function () {
    var x = window.scrollX, y = window.scrollY;
    var scrollTo = window.scrollTo;
    window.scrollTo = function (a, b) {
      if (typeof a === "number" && a === 0 && (b === 0 || b === 1)) {
        return scrollTo.call(window, x, y + b);
      }
      return scrollTo.apply(window, arguments);
    };
    try { toggle(); } finally {
      setTimeout(function () { window.scrollTo = scrollTo; }, 100);
    }
  };
})();
</script>
